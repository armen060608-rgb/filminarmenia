server.port=8080
server.servlet.context-path=/registration
server.error.whitelabel.enabled=false

user.service.version=/v1
platform.version=/v1

security.basic.enabled=false
management.security.enabled=false

# Enable response compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Enable HTTP/2 support
server.http2.enabled=true

# Uploaded file size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# ============================================
# DATABASE CONFIG
# ============================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ============================================
# FLYWAY
# ============================================
spring.flyway.url=${spring.datasource.url}
spring.flyway.password=${spring.datasource.password}
spring.flyway.user=${spring.datasource.username}
spring.flyway.schemas=registration

# ============================================
# EMAIL CONFIG
# ============================================
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.port=465
spring.mail.host=smtp.yandex.ru
spring.mail.protocol=smtps

# ============================================
# SWAGGER / OPENAPI
# ============================================
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true

# ============================================
# LOCALIZATION (i18n)
# ============================================
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.messages.cache-duration=3600

# ============================================
# UTF-8 ENCODING (CORRECT & SUPPORTED)
# ============================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ============================================
# SPRING CONFIG
# ============================================
spring.main.allow-bean-definition-overriding=true

# ============================================
# LOGGING
# ============================================
logging.level.org.springframework.context.support=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.registration.service=DEBUG
logging.level.com.registration=DEBUG
logging.level.org.springframework.transaction=DEBUG

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect



spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
